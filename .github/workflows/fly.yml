name: Test and deploy Linktag

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole main-branch pipeline so an older, slower check run
# cannot deploy after a newer commit.
concurrency:
  group: linktag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Django, React, and container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test apps/seeker/tests --settings=rec_eng_if_mvp.test_settings --noinput
      - run: python manage.py makemigrations --check --dry-run --settings=rec_eng_if_mvp.test_settings
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'true'
      - name: Build production image
        run: docker build --tag linktag-ci .
      - name: Smoke-test Django and production static assets
        shell: bash
        run: |
          docker run --detach --name linktag-ci -p 8000:8000 \
            -e SECRET_KEY=ci-only-placeholder -e DATABASE_URL=sqlite:///:memory: \
            -e SENTRY_DSN= linktag-ci
          trap 'docker logs linktag-ci; docker rm --force linktag-ci' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/healthz/
          curl --fail --silent http://127.0.0.1:8000/ | grep 'id="root"'
          curl --fail --silent http://127.0.0.1:8000/seeker/login/ | grep 'Sign in to Linktag'
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/static/css/linktag.css
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/static/images/tag-art.png

  deploy:
    name: Deploy to Fly.io
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: linktag-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy the tested commit
        run: |
          test -n "$FLY_API_TOKEN" || { echo "Missing repository secret FLY_API_TOKEN"; exit 1; }
          flyctl deploy --remote-only --app linktag
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployed health endpoint
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 5 https://linktag.fly.dev/healthz/
