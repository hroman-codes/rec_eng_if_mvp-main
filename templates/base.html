{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061c34">
  <title>{% block title %}Linktag{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/linktag.css' %}">
  <link rel="stylesheet" href="{% static 'css/bootstrap-icons.min.css' %}">
  <script src="{% static 'js/linktag.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#page-content">Skip to content</a>
  {% if messages %}<div class="notifications" aria-label="Notifications">{% for message in messages %}<div class="notice {{ message.tags }}" role="status"><span>{{ message }}</span><button type="button" class="icon-button" data-dismiss aria-label="Dismiss notification">×</button></div>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
